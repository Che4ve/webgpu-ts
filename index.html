<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgpu-ts</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="container">
      <div class="canvas-container">
        <canvas id="gfx" width="1280" height="720"></canvas>
      </div>
      <form id="controls-form" class="ui">
        <fieldset>
          <legend>Lighting</legend>
          <div class="subgrid two-col">
            <div class="card">
              <h4>Ambient</h4>
              <label>Color <input id="ambient-color" type="color" value="#1f212a"></label>
              <label>Intensity <input id="ambient-intensity" type="range" min="0" max="2" step="0.01" value="0.35"></label>
            </div>
            <div class="card">
              <h4>Directional</h4>
              <label>Yaw <input id="dir-yaw" type="range" min="-3.14159" max="3.14159" step="0.01" value="2.2"></label>
              <label>Pitch <input id="dir-pitch" type="range" min="-1.4" max="1.4" step="0.01" value="-0.35"></label>
              <label>Color <input id="dir-color" type="color" value="#ffffff"></label>
              <label>Intensity <input id="dir-intensity" type="range" min="0" max="4" step="0.01" value="1.3"></label>
            </div>
          </div>

          <div class="subgrid two-col">
            <div class="card">
              <h4>Material</h4>
              <label>Albedo <input id="mat-albedo" type="color" value="#c2c2c2"></label>
              <label>Specular <input id="mat-specular" type="color" value="#f7f7f7"></label>
              <label>Shininess <input id="mat-shininess" type="range" min="1" max="128" step="1" value="64"></label>
            </div>
            <div class="card">
              <h4>Point lights</h4>
              <label>Count <input id="point-count" type="range" min="0" max="2" step="1" value="2"></label>
              <div class="point-grid">
                <div class="point">
                  <div class="point-title">P1</div>
                  <label>Color <input id="p0-color" type="color" value="#ffc48c"></label>
                  <label>Intensity <input id="p0-intensity" type="range" min="0" max="30" step="0.1" value="2"></label>
                  <div class="triple">
                    <label>X <input id="p0-x" type="range" min="-4" max="4" step="0.1" value="1.8"></label>
                    <label>Y <input id="p0-y" type="range" min="0" max="3" step="0.1" value="1.5"></label>
                    <label>Z <input id="p0-z" type="range" min="-4" max="4" step="0.1" value="1.8"></label>
                  </div>
                </div>
                <div class="point">
                  <div class="point-title">P2</div>
                  <label>Color <input id="p1-color" type="color" value="#7fd3ff"></label>
                  <label>Intensity <input id="p1-intensity" type="range" min="0" max="30" step="0.1" value="4"></label>
                  <div class="triple">
                    <label>X <input id="p1-x" type="range" min="-4" max="4" step="0.1" value="-2.2"></label>
                    <label>Y <input id="p1-y" type="range" min="0" max="3" step="0.1" value="1.2"></label>
                    <label>Z <input id="p1-z" type="range" min="-4" max="4" step="0.1" value="1.4"></label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>Model</legend>
          <p class="note">
            WASD + мышь — движение камеры. Пробел/Control — вверх/вниз. Shift — ускорение. Кликните по canvas,
            чтобы захватить курсор.
          </p>
          <label>Scale X <input id="sr-x" type="range" min="0" max="2" step="0.01" value="0.5"></label>
          <label>Scale Y <input id="sr-y" type="range" min="0" max="2" step="0.01" value="0.5"></label>
          <label>Scale Z <input id="sr-z" type="range" min="0" max="2" step="0.01" value="0.5"></label>
          <label>Translation Z <input id="tr-z" type="range" min="0" max="12" step="0.01" value="2.5"></label>
          <label>Rotation <input id="rot" type="range" min="0" max="6.283185307179586" step="0.01" value="2.5"></label>
          <div class="row">
            <label>Spin <input id="spin" type="checkbox"></label>
            <label>Pulse Y <input id="pulse" type="checkbox"></label>
          </div>
          <button id="reset" type="button">Reset</button>
        </fieldset>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
